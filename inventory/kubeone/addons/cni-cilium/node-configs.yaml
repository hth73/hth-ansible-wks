apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: master-ip-pool
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: flatcar-master1
  defaults:
    ipam-default-ip-pool: master-pool
---
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: worker1-ip-pool
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: flatcar-worker1
  defaults:
    ipam-default-ip-pool: worker1-pool
---
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: worker2-ip-pool
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: flatcar-worker2
  defaults:
    ipam-default-ip-pool: worker2-pool
