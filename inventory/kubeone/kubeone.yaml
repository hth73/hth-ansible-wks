apiVersion: kubeone.k8c.io/v1beta2
kind: KubeOneCluster
name: kubernetes

# Kubernetes-Version
versions:
  kubernetes: v1.37.2

# Cloud-Provider
cloudProvider:
  none: {}

# Container Runtime
containerRuntime:
  containerd: {}

# Cluster-Netzwerk
clusterNetwork:
  podSubnet: 172.20.0.0/16
  serviceSubnet: 10.96.0.0/12
  cni:
    cilium:
      kubeProxyReplacement: strict
      enableHubble: false
  kubeProxy:
    skipInstallation: true

# Control Plane
controlPlane:
  hosts:
    - publicAddress: 192.168.178.210
      privateAddress: 192.168.178.210
      sshUsername: core
      sshAgentSocket: env:SSH_AUTH_SOCK
      taints:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule

# Statische Worker
staticWorkers:
  hosts:
    - publicAddress: 192.168.178.213
      privateAddress: 192.168.178.213
      sshUsername: core
      sshAgentSocket: env:SSH_AUTH_SOCK
      labels:
        node-role.kubernetes.io/worker: "true"

    - publicAddress: 192.168.178.214
      privateAddress: 192.168.178.214
      sshUsername: core
      sshAgentSocket: env:SSH_AUTH_SOCK
      labels:
        node-role.kubernetes.io/worker: "true"

# Kubernetes API Endpoint
apiEndpoint:
  host: 192.168.178.210
  port: 6443

# Keine dynamische Node-Verwaltung
machineController:
  deploy: false

# Kein Operating System Manager
operatingSystemManager:
  deploy: false

# Kubernetes features
features:
  nodeLocalDNS:
    deploy: true
  metricsServer:
    enable: true

# Kubernetes addons
addons:
  enable: true
  path: ./addons

# Cert-Manager
helmReleases:
  - releaseName: cert-manager
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    namespace: cert-manager
    version: v1.21.3
    wait: true
    timeout: 10m
    values:
      - inline:
          crds:
            enabled: true
            keep: true
  - releaseName: traefik
    chart: traefik
    repoURL: https://traefik.github.io/charts
    namespace: traefik
    version: "42.4.0"
    wait: true
    timeout: 10m
    values:
      - valuesFile: inventory/kubeone/helm-values/traefik-values.yaml
  - releaseName: metallb
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    namespace: metallb-system
    version: "0.16.2"
    wait: true
    timeout: 10m
