cluster:
  name: kubernetes

devices:
  - enp0s8

k8sServiceHost: "192.168.178.210"
k8sServicePort: "6443"

egressMasqueradeInterfaces: enp0s3

# multi-pool: ein festes /24 pro Node. Welcher Node welchen Pool bekommt,
# steht in charts/cilium-node-ipam (CiliumNodeConfig). Die Pool-Namen dort
# muessen zu den Namen hier passen.
ipam:
  mode: multi-pool
  operator:
    autoCreateCiliumPodIPPools:
      master-pool:
        ipv4:
          cidrs:
            - "172.20.210.0/24"
          maskSize: 24
      worker1-pool:
        ipv4:
          cidrs:
            - "172.20.213.0/24"
          maskSize: 24
      worker2-pool:
        ipv4:
          cidrs:
            - "172.20.214.0/24"
          maskSize: 24

kubeProxyReplacement: true

routingMode: native
ipv4NativeRoutingCIDR: "172.20.0.0/16"
autoDirectNodeRoutes: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false

cni:
  exclusive: false

preflight:
  enabled: false

enableLBIPAM: false

l2announcements:
  enabled: false

operator:
  enabled: true
  replicas: 1
  # CRDs legt der Operator passend zur Cilium-Version an (nicht skippen).
  podDisruptionBudget:
    enabled: true

hubble:
  enabled: false
