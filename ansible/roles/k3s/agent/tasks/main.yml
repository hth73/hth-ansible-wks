---
- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"

- name: Read k3s node token from master
  become: true
  delegate_to: master
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  run_once: true

- name: Set k3s token fact
  set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Install k3s agent
  become: true
  shell: |
    INSTALL_K3S_EXEC="agent --node-ip={{ ansible_host }}" \
    K3S_URL=https://{{ hostvars['master']['ansible_host'] }}:6443 \
    K3S_TOKEN={{ k3s_node_token }} \
    /tmp/install-k3s.sh
  args:
    creates: /usr/local/bin/k3s-agent

- name: Ensure k3s-agent service is running
  become: true
  systemd:
    name: k3s-agent
    enabled: true
    state: started
