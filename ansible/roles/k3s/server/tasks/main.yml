---
# ---------------------------------------------------------------------------
# Download and Install k3s
# ---------------------------------------------------------------------------
- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"

- name: Install k3s server
  become: true
  shell: |
    INSTALL_K3S_EXEC="server \
    --node-ip={{ ansible_host }} \
    --flannel-iface=enp0s8 \
    --tls-san={{ ansible_host }}" \
    /tmp/install-k3s.sh
  args:
    creates: /usr/local/bin/k3s

# ---------------------------------------------------------------------------
# Ensure k3s service is enabled and running
# ---------------------------------------------------------------------------
- name: Ensure k3s service is running
  become: true
  systemd:
    name: k3s
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Wait for k3s API
# ---------------------------------------------------------------------------
- name: Wait for k3s API
  wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

# ---------------------------------------------------------------------------
# Wait for node token
# ---------------------------------------------------------------------------
- name: Wait for k3s node token
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

# ---------------------------------------------------------------------------
# Read node token
# ---------------------------------------------------------------------------
- name: Read k3s node token
  become: true
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

# ---------------------------------------------------------------------------
# Export token as Ansible fact
# ---------------------------------------------------------------------------
- name: Set k3s node token fact
  set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
