---
# ---------------------------------------------------------------------------
# Download k3s install script
# ---------------------------------------------------------------------------
- name: Download k3s install script
  become: true
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"

# ---------------------------------------------------------------------------
# Initialize K3s cluster
# ---------------------------------------------------------------------------
- name: Initialize k3s cluster
  become: true
  ansible.builtin.shell: |
    INSTALL_K3S_EXEC="server \
    --cluster-init \
    --node-ip={{ ansible_host }} \
    --flannel-iface=enp0s8 \
    --tls-san={{ ansible_host }}" \
    /tmp/install-k3s.sh
  args:
    creates: /usr/local/bin/k3s

# ---------------------------------------------------------------------------
# Ensure k3s service is enabled and running
# ---------------------------------------------------------------------------
- name: Ensure k3s service is running
  become: true
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Wait for k3s API
# ---------------------------------------------------------------------------
- name: Wait for k3s API
  become: true
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

# ---------------------------------------------------------------------------
# Wait for k3s node token
# ---------------------------------------------------------------------------
- name: Wait for k3s node token
  become: true
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

# ---------------------------------------------------------------------------
# Read k3s node token
# ---------------------------------------------------------------------------
- name: Read k3s node token
  become: true
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

# ---------------------------------------------------------------------------
# Configure kubectl for user core
# ---------------------------------------------------------------------------
- name: Create .kube directory
  become: true
  ansible.builtin.file:
    path: /home/core/.kube
    state: directory
    owner: core
    group: core
    mode: "0700"

- name: Copy kubeconfig for user core
  become: true
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/core/.kube/config
    remote_src: true
    owner: core
    group: core
    mode: "0600"

- name: Configure KUBECONFIG in bashrc
  become: true
  ansible.builtin.lineinfile:
    path: /home/core/.bashrc
    line: 'export KUBECONFIG="$HOME/.kube/config"'
    state: present
    create: true
    owner: core
    group: core
    mode: "0644"

# ---------------------------------------------------------------------------
# Export token as Ansible fact
# ---------------------------------------------------------------------------
- name: Set k3s node token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
