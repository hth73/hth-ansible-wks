# ---------------------------------------------------------------------------
# Download k3s install script
# ---------------------------------------------------------------------------
- name: Download k3s install script
  become: true
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"

# ---------------------------------------------------------------------------
# Read K3s node token from initial server
# ---------------------------------------------------------------------------
- name: Read k3s node token from initial server
  become: true
  delegate_to: "{{ groups['k3s_server_init'][0] }}"
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  run_once: true

# ---------------------------------------------------------------------------
# Join existing K3s cluster
# ---------------------------------------------------------------------------
- name: Join k3s cluster
  become: true
  ansible.builtin.shell: |
    INSTALL_K3S_EXEC="server \
    --server=https://{{ k3s_server_init_ip }}:6443 \
    --token={{ k3s_token_raw.content | b64decode | trim }} \
    --node-ip={{ ansible_host }} \
    --flannel-iface=enp0s8 \
    --tls-san={{ ansible_host }}" \
    /tmp/install-k3s.sh
  args:
    creates: /usr/local/bin/k3s
  no_log: true

# ---------------------------------------------------------------------------
# Ensure k3s service is enabled and running
# ---------------------------------------------------------------------------
- name: Ensure k3s service is running
  become: true
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Wait for k3s API
# ---------------------------------------------------------------------------
- name: Wait for k3s API
  become: true
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120

# ---------------------------------------------------------------------------
# Read kubeconfig from initial server
# ---------------------------------------------------------------------------
- name: Read kubeconfig from initial server
  become: true
  delegate_to: "{{ groups['k3s_server_init'][0] }}"
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: master_kubeconfig
  run_once: true

# ---------------------------------------------------------------------------
# Configure kubectl for user core
# ---------------------------------------------------------------------------
- name: Create .kube directory
  become: true
  ansible.builtin.file:
    path: /home/core/.kube
    state: directory
    owner: core
    group: core
    mode: "0700"

- name: Install kubeconfig
  become: true
  ansible.builtin.copy:
    content: "{{ master_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ k3s_server_init_ip ~ ':6443') }}"
    dest: /home/core/.kube/config
    owner: core
    group: core
    mode: "0600"

# ---------------------------------------------------------------------------
# Configure KUBECONFIG in bashrc
# ---------------------------------------------------------------------------
- name: Configure KUBECONFIG in bashrc
  become: true
  ansible.builtin.lineinfile:
    path: /home/core/.bashrc
    line: 'export KUBECONFIG="$HOME/.kube/config"'
    state: present
    create: true
    owner: core
    group: core
    mode: "0644"
