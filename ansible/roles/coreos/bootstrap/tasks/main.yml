---
- name: Check if python3 exists
  raw: test -x /usr/bin/python3
  register: python_check
  failed_when: false
  changed_when: false

- name: Install Python 3 using rpm-ostree
  become: true
  raw: rpm-ostree install -y --allow-inactive python3
  register: rpm_ostree_install
  changed_when: "'Run \"systemctl reboot\" to start a reboot' in rpm_ostree_install.stdout"
  when: python_check.rc != 0

- name: Install ISCSI Initiator using rpm-ostree
  become: true
  raw: rpm-ostree install -y --allow-inactive iscsi-initiator-utils
  register: iscsi_install
  changed_when: "'Run \"systemctl reboot\" to start a reboot' in iscsi_install.stdout"

- name: Reboot Fedora CoreOS
  become: true
  raw: systemctl reboot
  when:
    - (python_install is defined and python_install.changed) or
      (iscsi_install is defined and iscsi_install.changed)

- name: Wait for SSH reconnection
  wait_for_connection:
    delay: 10
    timeout: 300
  when:
    - (python_install is defined and python_install.changed) or
      (iscsi_install is defined and iscsi_install.changed)
